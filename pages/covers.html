<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>covers — qumcl</title>
    <meta name="description" content="qumcl — covers. Personal site of Egor Gerasenko.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/assets/images/favicon-96x96.png" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark' } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="wrap">
    <div class="statusbar">
  <span class="statusbar-brand">
    <img src="/assets/images/qumcl_logo.png" alt="qumcl" class="statusbar-logo">
    <span class="typewriter" data-text="qumcl // covers">qumcl // covers</span>
  </span>
        <span id="clock">—</span>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">[ dark ]</button>
    </div>

    <div class="hero">
        <div class="id"><a href="/">&lt; back</a> — Egor Gerasenko — qumcl</div>
        <h1>covers</h1>
        <div class="tagline typewriter" data-phrases="covers" data-text="stuff like that.">stuff like that.</div>
    </div>

    <div class="art-filters">
        <select id="year-filter" aria-label="Filter by year">
            <option value="all">All years</option>
        </select>
        <button id="sort-btn" aria-label="Sort covers">Sort: Newest first ▼</button>
    </div>

    <div class="box">
        <div class="box-label">// <b>— covers</b></div>
        <div class="embed">
            <ul class="art-container" id="art-container" data-category="covers">
                <li class="loading-text">Loading covers...</li>
            </ul>
        </div>
    </div>

    <div id="lightbox-overlay" class="lightbox-hidden">
        <div class="lightbox-window">
            <div class="lightbox-header">
                <span class="lightbox-title">[VIEW]</span>
                <button id="lightbox-close">[X]</button>
            </div>
            <div class="lightbox-content">
                <img id="lightbox-image" alt="Art">
            </div>
        </div>
    </div>

    <footer>
        <span>xeuqra records — <a href="https://xeuqra.com/">label site</a></span>
        <span>© <span data-year></span> Egor Gerasenko Deykun (qumcl). All rights reserved.</span>
    </footer>

</div>

<script type="module" src="/js/gallery.js"></script>
<script src="/js/clock.js"></script>
<script src="/js/typewriter.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
